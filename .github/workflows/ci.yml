name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          SESSION_SECRET: placeholder-ci-secret

  e2e:
    runs-on: ubuntu-latest
    # The runner has Docker, so the suite gets a throwaway Supabase stack of its
    # own. The keys below are the CLI's fixed local-only demo keys.
    env:
      E2E_SUPABASE_URL: http://127.0.0.1:54321
      E2E_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      E2E_SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      E2E_SESSION_SECRET: e2e-only-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: ./node_modules/.bin/supabase start
      - run: npm run setup:test-data
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deploying from CI is opt-in. Without VERCEL_TOKEN every step below is
    # skipped and `vercel --prod` from a laptop stays the way to ship. Add the
    # three secrets to turn it on, and a push then reaches the shop only after
    # the audit, lint, types, unit tests, the build and the E2E suite pass —
    # which a laptop deploy skips entirely.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Report that CI deploys are switched off
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN is not set, skipping the deploy. See README.md."
      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22
      - name: Deploy to production
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@56 deploy --prod --yes --token "$VERCEL_TOKEN"
